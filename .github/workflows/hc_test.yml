name: hc_test

# Prueba del vigilante (P-031): fuerza un /fail controlado en egmfin-alarmas,
# espera, y lo restaura con una pasada normal de check_alarms. Solo manual.
# Debe llegar un correo de Healthchecks "egmfin-alarmas is DOWN" y luego "is UP".
# Ver docs/VIGILANCIA.md.

on:
  workflow_dispatch:

jobs:
  hc-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv supabase

      - name: Forzar /fail controlado
        working-directory: egmfin-jobs
        env:
          HC_PING_KEY: ${{ secrets.HC_PING_KEY }}
        run: |
          python3 check_alarms.py --test-fail

      # Margen para que Healthchecks registre el DOWN y mande el correo
      - name: Esperar
        run: sleep 90

      - name: Restaurar a ok (pasada normal)
        if: always()
        working-directory: egmfin-jobs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HC_PING_KEY: ${{ secrets.HC_PING_KEY }}
        run: |
          python3 check_alarms.py
